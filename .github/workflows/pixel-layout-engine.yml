name: Pixel Layout Engine CI

on:
  push:
    branches:
      - "main"
      - "feat/pixel-layout-engine-*"
  pull_request:
    paths:
      - "src/pixel_layout_engine.py"
      - "src/grid_deck.py"
      - "src/powerpoint_finalize.py"
      - "src/design_lint.py"
      - "src/ir_to_pptx.js"
      - "src/lint_ir.js"
      - "tests/test_pixel_layout_engine.py"
      - "tests/test_grid_deck.py"
      - "tests/test_powerpoint_finalize.py"
      - "tests/test_design_lint.py"
      - "tests/test_ir_media.js"
      - "examples/pixel_deck_4x3.json"
      - "examples/grid_deck_glanceable.json"
      - "presets/glanceable-*.json"
      - "skills/glanceable-grid-presentation/SKILL.md"
      - "package.json"
      - ".github/workflows/pixel-layout-engine.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: python tests/test_pixel_layout_engine.py
      - run: npm run test:grid
      - run: npm run test:design
      - run: npm run test:finalize
      - run: npm run test:media
      - run: npm run build:pixel
      - run: npm run build:grid
      - run: node src/lint_ir.js output/pixel_deck_4x3.json
